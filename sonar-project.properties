# Identificador único del proyecto en SonarQube
sonar.projectKey=Street-urban-ecommerce
sonar.projectName=Street Urban Ecommerce
# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8
# Directorios a analizar (código fuente de Laravel)
sonar.sources=app,config,routes,database,resources
# Archivos/directorios a excluir del análisis de calidad
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,node_modules/**,public/**,tests/**
# Si tienes pruebas unitarias PHPUnit con reporte de cobertura (opcional)
# sonar.php.coverage.reportPaths=tests/coverage/clover.xml
