# Identificador único del proyecto en SonarQube
sonar.projectKey=Street-urban-ecommerce
sonar.projectName=Street Urban Ecommerce
# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8
# Directorios a analizar (código fuente de Laravel)
sonar.sources=app,config,routes,database,resources
# Archivos/directorios a excluir del análisis de calidad
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,node_modules/**,public/**,tests/**
# Si tienes pruebas unitarias PHPUnit con reporte de cobertura (opcional)
# sonar.php.coverage.reportPaths=tests/coverage/clover.xml

# Falsos positivos conocidos (ver motivo en cada regla)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10
# e1: los .vue son fragmentos; el <title> lo pone la pagina raiz (app.blade.php) via <Head> de Inertia
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=resources/**
# e2-e4: componentes envoltorio genericos (input/checkbox): la etiqueta se asocia en quien los usa
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=resources/js/Components/Checkbox.vue
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=resources/js/Components/TextInput.vue
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=resources/views/components/text-input.blade.php
# e5-e6: componente <label> generico: el 'for' lo pone quien lo usa
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e5.resourceKey=resources/js/Components/InputLabel.vue
sonar.issue.ignore.multicriteria.e6.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e6.resourceKey=resources/views/components/input-label.blade.php
# e7: el enlace de "Cerrar sesion" es un <a>, ya accesible con teclado
sonar.issue.ignore.multicriteria.e7.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e7.resourceKey=resources/views/layouts/navigation.blade.php
# e8: autocomplete="name" es un valor valido (Register.vue, plantilla Breeze)
sonar.issue.ignore.multicriteria.e8.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.e8.resourceKey=resources/js/Pages/Auth/Register.vue
# e9: textos repetidos en config/ son valores por defecto del framework
sonar.issue.ignore.multicriteria.e9.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e9.resourceKey=config/**
# e10: el parametro $request es un FormRequest; inyectarlo ya ejecuta la validacion
sonar.issue.ignore.multicriteria.e10.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e10.resourceKey=app/Http/Controllers/Shop/DataRegisterController.php

# Duplicacion: seeders, migraciones y config son codigo repetitivo por naturaleza (no se excluyen del analisis de calidad)
sonar.cpd.exclusions=database/seeders/**,database/migrations/**,config/**
